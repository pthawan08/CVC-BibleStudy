<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คชื่อเข้าเรียน</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style> 
        body { font-family: 'Sarabun', sans-serif; } 
        /* ปรับแต่งช่องค้นหาให้สวยงามเข้ากับ Theme */
        .select2-container .select2-selection--single {
            height: 45px;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            top: 10px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full border-t-4 border-[#C5A66B]">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">เช็คชื่อเข้าเรียน 📝</h1>

        <form id="checkinForm" class="space-y-5">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">1. ค้นหาชื่อของคุณ</label>
                <select id="studentName" class="w-full select2">
                    <option value="">-- พิมพ์ชื่อเพื่อค้นหา --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">2. วิชาที่จะเช็คชื่อ</label>
                <select id="subjectSelect" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-[#C5A66B] bg-gray-50">
                    <option value="">-- กรุณาเลือกชื่อก่อน --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">3. เช็คชื่อครั้งที่</label>
                <select id="weekNumber" required class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-[#C5A66B]">
                    <option value="1">ครั้งที่ 1</option>
                    <option value="2">ครั้งที่ 2</option>
                    <option value="3">ครั้งที่ 3</option>
                    <option value="4">ครั้งที่ 4</option>
                    <option value="5">ครั้งที่ 5</option>
                    <option value="6">ครั้งที่ 6</option>
                    <option value="7">ครั้งที่ 7</option>
                    <option value="8">ครั้งที่ 8</option>
                    <option value="9">ครั้งที่ 9</option>
                    <option value="10">ครั้งที่ 10</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-[#C5A66B] hover:bg-[#A68A55] text-white font-bold py-3 rounded-lg shadow mt-2 transition">
                บันทึกการเข้าเรียน
            </button>

            <a href="index.html" class="block text-center text-sm text-gray-400 mt-4 hover:text-gray-600">← กลับหน้าสมัคร</a>
        </form>
    </div>

    <script>
        // 🔴🔴 ใส่ URL ของคุณตรงนี้ 🔴🔴
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzaJrNqN513arD14Pcw963xukIZ3Zpx6DpFnc-KdHhfh6pQ22hxteUCO4OSKnwc513o/exec"; 

        let studentDataMap = {}; 

        // เริ่มทำงานเมื่อเปิดเว็บ
        $(document).ready(function() {
            // ตั้งค่า Select2 ให้กับช่องเลือกชื่อ
            $('#studentName').select2({
                placeholder: "พิมพ์ชื่อ หรือ นามสกุล...",
                allowClear: true,
                width: '100%'
            });

            // ดึงข้อมูลจาก Server
            fetch(WEB_APP_URL)
            .then(res => res.json())
            .then(data => {
                const select = $('#studentName'); // ใช้ jQuery เลือก element
                select.empty(); // ล้างข้อมูลเก่า
                select.append('<option value="">-- พิมพ์ชื่อเพื่อค้นหา --</option>');
                
                // วนลูปสร้างตัวเลือก
                data.forEach(row => {
                    const name = row[0];
                    const subjects = row[1];
                    studentDataMap[name] = subjects;
                    
                    // เพิ่มตัวเลือกลงใน Dropdown
                    const newOption = new Option(name, name, false, false);
                    select.append(newOption);
                });
                
                // บอก Select2 ว่าข้อมูลเปลี่ยนแล้ว
                select.trigger('change');
            });

            // เมื่อมีการเลือกชื่อ (Event ของ Select2)
            $('#studentName').on('select2:select', function (e) {
                const name = e.params.data.id;
                updateSubjectList(name);
            });
        });

        // ฟังก์ชันอัปเดตวิชา
        function updateSubjectList(name) {
            const subjectSelect = document.getElementById('subjectSelect');
            subjectSelect.innerHTML = '<option value="">-- เลือกวิชา --</option>';

            if (name && studentDataMap[name]) {
                const subjects = studentDataMap[name].split(', ');
                subjects.forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub;
                    option.text = sub;
                    subjectSelect.appendChild(option);
                });
            }
        }

        // กดส่งข้อมูล
        document.getElementById('checkinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // ดึงค่าจาก Select2 ต้องใช้ jQuery .val()
            const name = $('#studentName').val(); 
            const subject = document.getElementById('subjectSelect').value;
            const week = document.getElementById('weekNumber').value;
            const btn = document.getElementById('submitBtn');

            if(!name) {
                Swal.fire('ลืมอะไรไปหรือเปล่า?', 'กรุณาค้นหาและเลือกชื่อก่อนครับ', 'warning');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'กำลังบันทึก...';

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "check", name, subject, week, check: true })
            })
            .then(res => res.json())
            .then(data => {
                if(data.result === 'success') {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: `วิชา: ${subject} (ครั้งที่ ${week})`, timer: 2000, showConfirmButton: false });
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            })
            .catch(() => Swal.fire('Error', 'เชื่อมต่อไม่ได้', 'error'))
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = 'บันทึกการเข้าเรียน';
            });
        });
    </script>
</body>
</html>
