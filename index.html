<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครเรียนหลักสูตรชั้นเตรียมเพื่อการรับใช้</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen relative">

    <div class="absolute top-4 right-4 z-10">
        <a href="checkin.html" class="bg-white border border-[#C5A66B] text-[#C5A66B] px-4 py-2 rounded-lg shadow-sm hover:bg-[#C5A66B] hover:text-white transition font-bold text-sm flex items-center gap-2">
            <span>📝</span> เช็คชื่อเข้าเรียน
        </a>
    </div>

    <div class="max-w-2xl mx-auto bg-white shadow-xl rounded-lg overflow-hidden my-10">
        <div class="bg-[#C5A66B] p-6 text-center text-white pt-12 md:pt-6">
            <h1 class="text-2xl font-bold">สมัครเรียนหลักสูตรชั้นเตรียมเพื่อการรับใช้</h1>
            <p class="mt-2 text-sm opacity-90">ขอพระเจ้าอวยพรในการศึกษาพระวจนะ</p>
        </div>

        <div class="p-8">
            <form id="regisForm" class="space-y-6">
                <div class="space-y-4">
                    <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">1. ข้อมูลผู้สมัคร</h3>
                    
                    <div><label class="block text-sm font-medium text-gray-700">ชื่อ - นามสกุล</label><input type="text" name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-gray-50"></div>
                    
                    <div><label class="block text-sm font-medium text-gray-700">เบอร์ติดต่อ</label><input type="tel" name="phone" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-gray-50" placeholder="เช่น 0812345678"></div>
                    
                    <div><label class="block text-sm font-medium text-gray-700">ที่อยู่ในการจัดส่งหนังสือ</label><textarea name="address" required rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-gray-50" placeholder="บ้านเลขที่ หมู่ ซอย ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์"></textarea></div>

                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700">เพศ</label><select name="gender" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-gray-50"><option>ชาย</option><option>หญิง</option></select></div>
                        <div><label class="block text-sm font-medium text-gray-700">อายุความเชื่อ (ปี)</label><input type="text" name="faithAge" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-gray-50"></div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700">คริสตจักร</label><input type="text" name="church" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-gray-50"></div>
                </div>

                <div class="space-y-4">
                    <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">2. เลือกรูปแบบการเรียน</h3>
                    <div class="flex items-center space-x-6">
                        <label class="flex items-center cursor-pointer"><input type="radio" name="studyType" value="full" checked onclick="toggleSubjects(false)" class="text-[#C5A66B]"><span class="ml-2">เรียนทั้งหลักสูตร</span></label>
                        <label class="flex items-center cursor-pointer"><input type="radio" name="studyType" value="subject" onclick="toggleSubjects(true)" class="text-[#C5A66B]"><span class="ml-2">เลือกเรียนรายวิชา</span></label>
                    </div>
                    <div id="subjectList" class="hidden bg-gray-50 p-4 rounded-md border space-y-2">
                        <p class="text-sm font-bold text-gray-700">เลือกวิชา:</p>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="รากฐานความเชื่อคริสเตียน" class="mr-2"> 1. รากฐานความเชื่อคริสเตียน</label>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="การศึกษาพระคัมภีร์เบื้องต้น" class="mr-2"> 2. การศึกษาพระคัมภีร์เบื้องต้น</label>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="เข้าใจการนมัสการ" class="mr-2"> 3. เข้าใจการนมัสการ</label>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="วิถีชีวิตคริสเตียน" class="mr-2"> 4. วิถีชีวิตคริสเตียน</label>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="เข้าใจความสัมพันธ์กับพระเจ้า" class="mr-2"> 5. เข้าใจความสัมพันธ์กับพระเจ้า</label>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="หลักการประกาศเบื้องต้น" class="mr-2"> 6. หลักการประกาศเบื้องต้น</label>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="ทักษะการใช้ชีวิต" class="mr-2"> 7. ทักษะการใช้ชีวิต</label>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="เข้าใจการอภิบาลเบื้องต้น" class="mr-2"> 8. เข้าใจการอภิบาลเบื้องต้น</label>
                        <label class="flex items-center"><input type="checkbox" name="subjects" value="เข้าใจงานรับใช้ในคริสตจักร" class="mr-2"> 9. เข้าใจงานรับใช้ในคริสตจักร</label>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">3. ชำระค่าลงทะเบียน</h3>
                    <div class="bg-[#FDF6E9] p-5 rounded-lg border border-[#E8DCC3] text-center">
                        <p class="font-bold text-lg text-[#8B6E3D]">บัญชีฝ่ายการศึกษา ธนาคารไทยพาณิชย์</p>
                        <p class="text-4xl font-bold my-3 select-all">428-177789-8</p>
                        <div class="text-sm text-gray-600">
                            ชื่อบัญชี: กาญจนา นาทศิโรรัตน์<br>สุธาทิพย์ โพธิ์ศรีทอง, อัญชลี เปี่ยมสุข
                        </div>
                        <button type="button" onclick="copyAccount()" class="mt-4 text-xs bg-white border border-[#C5A66B] text-[#C5A66B] px-4 py-2 rounded-full hover:bg-[#C5A66B] hover:text-white transition">📋 กดคัดลอกเลขบัญชี</button>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700">อัปโหลดสลิป</label><input type="file" id="slipFile" accept="image/*" required class="mt-1 block w-full text-sm text-gray-500 file:bg-[#C5A66B] file:text-white file:border-0 file:rounded-full file:px-4 file:py-2"/></div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gray-800 text-white py-4 rounded-lg font-bold text-lg shadow-lg hover:bg-gray-900 transition">ยืนยันการสมัครเรียน</button>
            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwz30fY1W0sThNLEIlfej1utuq8VU1-q0vSai8quVFtz4ZXzBfmeERGibyJXkzq554/exec"; 

        function toggleSubjects(show) {
            document.getElementById('subjectList').classList.toggle('hidden', !show);
        }

        function copyAccount() {
            navigator.clipboard.writeText("428-177789-8");
            Swal.fire({ icon: 'success', title: 'คัดลอกแล้ว', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
        }

        document.getElementById('regisForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'กำลังส่งข้อมูล...';
            btn.disabled = true;

            try {
                const formData = new FormData(this);
                const data = Object.fromEntries(formData);
                
                let subjects = [];
                if(data.studyType === 'full') {
                    subjects = [
                        "รากฐานความเชื่อคริสเตียน", "การศึกษาพระคัมภีร์เบื้องต้น", "เข้าใจการนมัสการ",
                        "วิถีชีวิตคริสเตียน", "เข้าใจความสัมพันธ์กับพระเจ้า", "หลักการประกาศเบื้องต้น",
                        "ทักษะการใช้ชีวิต", "เข้าใจการอภิบาลเบื้องต้น", "เข้าใจงานรับใช้ในคริสตจักร"
                    ];
                } else {
                    document.querySelectorAll('input[name="subjects"]:checked').forEach((cb) => subjects.push(cb.value));
                    if(subjects.length === 0) throw new Error("กรุณาเลือกวิชาอย่างน้อย 1 วิชา");
                }
                data.subjects = subjects;

                const fileInput = document.getElementById('slipFile');
                if (fileInput.files.length > 0) {
                    const reader = new FileReader();
                    reader.readAsDataURL(fileInput.files[0]);
                    reader.onload = function () {
                        data.slipImage = reader.result;
                        sendData(data, btn, originalText);
                    };
                } else {
                    sendData(data, btn, originalText);
                }
            } catch (error) {
                Swal.fire('Error', error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        function sendData(data, btn, originalText) {
            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(response => {
                if(response.result === 'success') {
                    Swal.fire({ icon: 'success', title: 'สมัครเรียบร้อย', confirmButtonColor: '#C5A66B' }).then(() => window.location.reload());
                } else {
                    throw new Error(response.message);
                }
            })
            .catch(error => {
                Swal.fire('Error', 'ส่งข้อมูลไม่สำเร็จ', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            });
        }
    </script>
</body>
</html>
